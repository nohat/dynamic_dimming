move:
  name: Move (start dimming)
  description: Start continuously changing a light's brightness until stopped.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: light
    direction:
      required: true
      selector:
        select:
          options: [up, down]
    rate:
      required: false
      selector:
        text:
    backend:
      required: false
      default: auto
      selector:
        select:
          options: [auto, native, simulated]
    curve:
      required: false
      description: >-
        How the travel is spread across the range. "perceptual" (default) moves
        at a steady apparent rate; "linear" moves at a steady brightness rate,
        which looks fast at the bottom and slow at the top. A number is a raw
        gamma between 1 and 6. Ignored where the device does its own ramp.
      selector:
        text:
stop:
  name: Stop dimming
  description: Stop an in-progress dimming movement.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: light
step:
  name: Step
  description: Apply a single relative brightness change.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: light
    direction:
      required: true
      selector:
        select:
          options: [up, down]
    step_pct:
      required: false
      selector:
        number:
          min: 1
          max: 100
    backend:
      required: false
      default: auto
      selector:
        select:
          options: [auto, native, simulated]
    curve:
      required: false
      description: >-
        How the travel is spread across the range. "perceptual" (default) moves
        at a steady apparent rate; "linear" moves at a steady brightness rate,
        which looks fast at the bottom and slow at the top. A number is a raw
        gamma between 1 and 6. Ignored where the device does its own ramp.
      selector:
        text:
fade:
  name: Fade
  description: >-
    Fade a light to an absolute brightness over a fixed duration. Unlike move,
    which is relative and open-ended, this promises a level at a time -- which
    is what a scene transition needs. Use it for lights whose platform cannot
    honour light.turn_on's `transition`, notably WiZ.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: light
    brightness_pct:
      required: true
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    duration:
      required: true
      description: Seconds the fade should take.
      selector:
        number:
          min: 0.1
          max: 120
          step: 0.1
          unit_of_measurement: s
    backend:
      required: false
      default: auto
      selector:
        select:
          options: [auto, native, simulated]
    curve:
      required: false
      description: >-
        As for move. A backend that cannot fade falls back to simulation, which
        writes absolute values and so always lands on the target.
      selector:
        text:
