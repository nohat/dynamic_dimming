move:
  name: Move (start dimming)
  description: Start continuously changing a light's brightness until stopped.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: light
    direction:
      required: true
      selector:
        select:
          options: [up, down]
    rate:
      required: false
      selector:
        text:
    backend:
      required: false
      default: auto
      selector:
        select:
          options: [auto, native, simulated]
    curve:
      required: false
      description: >-
        How the travel is spread across the range. "perceptual" (default) moves
        at a steady apparent rate; "linear" moves at a steady brightness rate,
        which looks fast at the bottom and slow at the top. A number is a raw
        gamma between 1 and 6. Ignored where the device does its own ramp.
      selector:
        text:
stop:
  name: Stop dimming
  description: Stop an in-progress dimming movement.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: light
step:
  name: Step
  description: Apply a single relative brightness change.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: light
    direction:
      required: true
      selector:
        select:
          options: [up, down]
    step_pct:
      required: false
      selector:
        number:
          min: 1
          max: 100
    backend:
      required: false
      default: auto
      selector:
        select:
          options: [auto, native, simulated]
    curve:
      required: false
      description: >-
        How the travel is spread across the range. "perceptual" (default) moves
        at a steady apparent rate; "linear" moves at a steady brightness rate,
        which looks fast at the bottom and slow at the top. A number is a raw
        gamma between 1 and 6. Ignored where the device does its own ramp.
      selector:
        text:
